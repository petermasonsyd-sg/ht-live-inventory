<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HT Live Inventory — connection test</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2/lib/msal-browser.min.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 16px;
    background: #faf9f7;
    color: #2a2620;
  }
  h1 {
    font-size: 1.3rem;
    margin-bottom: 4px;
  }
  p.sub {
    color: #6b6558;
    margin-top: 0;
    font-size: 0.95rem;
  }
  button {
    width: 100%;
    padding: 14px;
    font-size: 1.05rem;
    border-radius: 10px;
    border: none;
    background: #8a5a2c;
    color: white;
    margin-top: 16px;
  }
  button:disabled {
    background: #c9bfae;
  }
  #status {
    margin-top: 20px;
    padding: 14px;
    border-radius: 10px;
    background: #fff;
    border: 1px solid #e5e0d5;
    white-space: pre-wrap;
    font-size: 0.9rem;
    line-height: 1.4;
  }
  .ok { color: #2a6b3a; }
  .err { color: #a8331f; }
  ul { padding-left: 18px; }
</style>
</head>
<body>
  <h1>HT Live Inventory</h1>
  <p class="sub">Connection test — sign in to confirm live access to the inventory workbook.</p>

  <button id="signInBtn">Sign in with Microsoft</button>
  <div id="status">Not signed in yet.</div>

<script>
  const msalConfig = {
    auth: {
      clientId: "c3a84f45-a39d-43f6-85db-8344a8128ed7",
      authority: "https://login.microsoftonline.com/consumers",
      redirectUri: window.location.origin + window.location.pathname,
    },
    cache: {
      cacheLocation: "localStorage",
    },
  };

  const msalInstance = new msal.PublicClientApplication(msalConfig);
  const statusEl = document.getElementById("status");
  const signInBtn = document.getElementById("signInBtn");

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = cls || "";
  }

  async function init() {
    await msalInstance.initialize();
    const response = await msalInstance.handleRedirectPromise();
    let account = response ? response.account : msalInstance.getAllAccounts()[0];

    if (account) {
      signInBtn.style.display = "none";
      setStatus("Signed in as " + account.username + "\nChecking live connection...");
      await checkWorkbook(account);
    }
  }

  signInBtn.addEventListener("click", () => {
    msalInstance.loginRedirect({ scopes: ["Files.Read"] });
  });

  async function checkWorkbook(account) {
    try {
      const tokenResponse = await msalInstance.acquireTokenSilent({
        scopes: ["Files.Read"],
        account: account,
      });

      const headers = { Authorization: "Bearer " + tokenResponse.accessToken };

      const searchResp = await fetch(
        "https://graph.microsoft.com/v1.0/me/drive/root/search(q='HT Inventory Database')?$select=name,id",
        { headers }
      );
      const searchData = await searchResp.json();
      const matches = (searchData.value || []).filter((f) =>
        f.name.startsWith("HT Inventory Database")
      );

      if (matches.length === 0) {
        setStatus("Signed in, but no workbook found matching 'HT Inventory Database'.", "err");
        return;
      }

      // Pick the highest version number from filenames like "... (v77).xlsx"
      let best = null;
      let bestVersion = -1;
      for (const m of matches) {
        const versionMatch = m.name.match(/\(v(\d+)\)/i);
        const version = versionMatch ? parseInt(versionMatch[1], 10) : -1;
        if (version > bestVersion) {
          bestVersion = version;
          best = m;
        }
      }

      const wsResp = await fetch(
        `https://graph.microsoft.com/v1.0/me/drive/items/${best.id}/workbook/worksheets?$select=name`,
        { headers }
      );
      const wsData = await wsResp.json();
      const sheetNames = (wsData.value || []).map((w) => w.name);

      setStatus(
        `Live connection confirmed.\n\nLatest workbook: ${best.name}\n(found ${matches.length} versioned copies, picked highest)\n\nWorksheets:\n` +
          sheetNames.map((n) => "  - " + n).join("\n"),
        "ok"
      );
    } catch (err) {
      setStatus("Error: " + (err.message || err), "err");
    }
  }

  init();
</script>
</body>
</html>
