<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HT Live Inventory</title>
<script>
  window.addEventListener("error", function (e) {
    var el = document.getElementById("status");
    if (el) {
      el.textContent =
        "Page error: " + e.message + "\n(" + (e.filename || "") + ":" + e.lineno + ")";
      el.className = "err";
    }
  });
</script>
<script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2/lib/msal-browser.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 520px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    background: #faf9f7;
    color: #2a2620;
  }
  h1 { font-size: 1.3rem; margin-bottom: 4px; }
  h2 { font-size: 1.02rem; margin: 22px 0 8px; color: #4a4436; }
  p.sub { color: #6b6558; margin-top: 0; font-size: 0.95rem; }
  button {
    width: 100%;
    padding: 14px;
    font-size: 1.05rem;
    border-radius: 10px;
    border: none;
    background: #8a5a2c;
    color: white;
    margin-top: 12px;
    cursor: pointer;
  }
  button:disabled { background: #c9bfae; }
  button.secondary { background: #4a4436; }
  input[type="text"] {
    width: 100%;
    padding: 13px;
    font-size: 1.05rem;
    border-radius: 10px;
    border: 1px solid #d9d2c2;
    margin-top: 12px;
  }
  #status {
    margin-top: 16px;
    padding: 14px;
    border-radius: 10px;
    background: #fff;
    border: 1px solid #e5e0d5;
    white-space: pre-wrap;
    font-size: 0.88rem;
    line-height: 1.4;
  }
  .ok { color: #2a6b3a; }
  .err { color: #a8331f; }
  .muted { color: #8a8371; font-size: 0.82rem; }
  #searchArea { display: none; }
  .card {
    background: #fff;
    border: 1px solid #e5e0d5;
    border-radius: 10px;
    padding: 12px 14px;
    margin-top: 10px;
  }
  .card .title { font-weight: 600; font-size: 0.98rem; }
  .card .meta { font-size: 0.85rem; color: #6b6558; margin-top: 4px; line-height: 1.5; }
  .card a { color: #8a5a2c; }
  .pill {
    display: inline-block;
    font-size: 0.75rem;
    background: #f1ece0;
    color: #6b6558;
    border-radius: 100px;
    padding: 2px 9px;
    margin: 2px 4px 0 0;
  }
  .spinner-note { font-size: 0.85rem; color: #8a8371; margin-top: 8px; }
</style>
</head>
<body>
  <h1>HT Live Inventory</h1>
  <p class="sub">Sign in, then search stock, sales history and pricing while you're out buying.</p>

  <button id="signInBtn">Sign in with Microsoft</button>
  <div id="status">Not signed in yet.</div>

  <div id="searchArea">
    <h2>Search</h2>
    <input type="text" id="searchBox" placeholder="Title or author..." autocomplete="off" />
    <button id="searchBtn">Search</button>
    <button id="photoBtn" class="secondary">📷 Search by photo</button>
    <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none" />
    <p id="photoStatus" class="muted" style="min-height: 1.2em;"></p>

    <div id="results"></div>
  </div>

<script>
  // ---------- Microsoft sign-in / workbook loading (unchanged from the connection test) ----------
  const msalConfig = {
    auth: {
      clientId: "c3a84f45-a39d-43f6-85db-8344a8128ed7",
      authority: "https://login.microsoftonline.com/consumers",
      redirectUri: window.location.origin + window.location.pathname,
    },
    cache: { cacheLocation: "localStorage" },
  };

  // ---------- Google Programmable Search (rarity / pricing check) ----------
  // Uses the embeddable Search Element widget (Google-hosted, no API key/billing
  // required) rather than the Custom Search JSON API, which Google has closed to
  // new projects as of 2026.
  const GOOGLE_CSE_CX = "e4b78ab779ac24699";
  let gcseRarityCounter = 0;
  let currentRarityGname = null;
  let gcseLibraryReady = false;
  let gcseLoadCallbacks = [];

  const statusEl = document.getElementById("status");
  const signInBtn = document.getElementById("signInBtn");
  const searchArea = document.getElementById("searchArea");
  const searchBox = document.getElementById("searchBox");
  const searchBtn = document.getElementById("searchBtn");
  const resultsEl = document.getElementById("results");
  const photoBtn = document.getElementById("photoBtn");
  const photoInput = document.getElementById("photoInput");
  const photoStatus = document.getElementById("photoStatus");

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = cls || "";
  }

  let msalInstance;
  try {
    if (typeof msal === "undefined") {
      throw new Error("The sign-in library didn't load (network blocked, or the CDN address is wrong).");
    }
    msalInstance = new msal.PublicClientApplication(msalConfig);
  } catch (e) {
    setStatus("Setup error: " + e.message, "err");
  }

  // In-memory data loaded from the workbook (never persisted to disk)
  let inventoryRows = [];
  let salesRows = [];
  let invCols = {};
  let salesCols = {};

  if (msalInstance) {
    signInBtn.addEventListener("click", () => {
      msalInstance.loginRedirect({ scopes: ["Files.Read"] });
    });
    init().catch((e) => setStatus("Startup error: " + (e.message || e), "err"));
  }

  async function init() {
    await msalInstance.initialize();
    const response = await msalInstance.handleRedirectPromise();
    let account = response ? response.account : msalInstance.getAllAccounts()[0];

    if (account) {
      signInBtn.style.display = "none";
      setStatus("Signed in as " + account.username + "\nFinding the latest workbook...");
      await loadWorkbook(account);
    }
  }

  async function loadWorkbook(account) {
    try {
      const tokenResponse = await msalInstance.acquireTokenSilent({
        scopes: ["Files.Read"],
        account: account,
      });
      const headers = { Authorization: "Bearer " + tokenResponse.accessToken };

      // Graph's /search endpoint is relevance-ranked and NOT guaranteed to return
      // every matching file — with 60+ versioned copies it can (and did) miss the
      // actual highest version. Use search only to locate the folder, then list
      // that folder's full contents directly, which is exhaustive.
      const searchResp = await fetch(
        "https://graph.microsoft.com/v1.0/me/drive/root/search(q='HT Inventory Database')?$select=name,id,parentReference",
        { headers }
      );
      const searchData = await searchResp.json();
      let matches = (searchData.value || []).filter((f) => f.name.startsWith("HT Inventory Database"));

      if (matches.length === 0) {
        setStatus("Signed in, but no workbook found matching 'HT Inventory Database'.", "err");
        return;
      }

      const parentId = matches[0].parentReference && matches[0].parentReference.id;
      if (parentId) {
        const allInFolder = await listAllVersionsInFolder(parentId, headers);
        if (allInFolder.length > 0) matches = allInFolder;
      }

      let best = null, bestVersion = -1;
      for (const m of matches) {
        const versionMatch = m.name.match(/\(v(\d+)\)/i);
        const version = versionMatch ? parseInt(versionMatch[1], 10) : -1;
        if (version > bestVersion) { bestVersion = version; best = m; }
      }

      setStatus("Using " + best.name + "\nLoading Inventory and Sales...");

      const wsResp = await fetch(
        `https://graph.microsoft.com/v1.0/me/drive/items/${best.id}/workbook/worksheets?$select=name`,
        { headers }
      );
      const wsData = await wsResp.json();
      const sheetNames = (wsData.value || []).map((w) => w.name);

      const invName = sheetNames.find((n) => n.trim().toLowerCase() === "inventory");
      const salesName = sheetNames.find((n) => n.trim().toLowerCase() === "sales");

      if (!invName || !salesName) {
        setStatus("Couldn't find an 'Inventory' and/or 'Sales' sheet in " + best.name + ".", "err");
        return;
      }

      const invValues = await fetchSheetValues(best.id, invName, headers, "A1:AT5010");
      const salesValues = await fetchSheetValues(best.id, salesName, headers, "A1:BB10010");

      if (invValues.length < 2 || salesValues.length < 2) {
        setStatus("Inventory or Sales sheet came back empty.", "err");
        return;
      }

      invCols = {
        title: findColumn(invValues[0], ["product name", "item name", "title"]),
        author: findColumn(invValues[0], ["author"]),
        cost: findColumn(invValues[0], ["cost - sgd", "cost sgd", "cost (sgd)"]),
        regularPrice: findColumn(invValues[0], ["regular price"]),
        status: findColumn(invValues[0], ["status"]),
        sku: findColumn(invValues[0], ["sku"]),
      };
      salesCols = {
        title: findColumn(salesValues[0], ["item name", "product name", "title"]),
        price: findColumn(salesValues[0], ["sale price", "price"]),
        date: findColumn(salesValues[0], ["date sold", "date"]),
        channel: findColumn(salesValues[0], ["channel"]),
      };

      if (invCols.title === -1 || salesCols.title === -1) {
        setStatus(
          "Couldn't find a title/item name column — search can't run.\n\n" +
          "Inventory headers found: " + JSON.stringify(invValues[0]) + "\n\n" +
          "Sales headers found: " + JSON.stringify(salesValues[0]),
          "err"
        );
        return;
      }

      inventoryRows = invValues.slice(1);
      salesRows = salesValues.slice(1);

      setStatus(
        "Live connection confirmed.\n\nWorkbook: " + best.name +
        "\n(found " + matches.length + " versioned copies, picked highest)\n\n" +
        "Loaded " + inventoryRows.length + " inventory rows and " + salesRows.length + " sales rows.",
        "ok"
      );
      searchArea.style.display = "block";
    } catch (err) {
      setStatus("Error: " + (err.message || err), "err");
    }
  }

  async function listAllVersionsInFolder(parentId, headers) {
    let results = [];
    let url = `https://graph.microsoft.com/v1.0/me/drive/items/${parentId}/children?$select=name,id&$top=200`;
    while (url) {
      const resp = await fetch(url, { headers });
      const data = await resp.json();
      results = results.concat((data.value || []).filter((f) => f.name && f.name.startsWith("HT Inventory Database")));
      url = data["@odata.nextLink"] || null;
    }
    return results;
  }

  async function fetchSheetValues(workbookId, sheetName, headers, rangeAddress) {
    // Use a fixed, bounded range (not usedRange) — usedRange can balloon to
    // the whole sheet if formatting was ever applied to full columns, which
    // can make this request take a very long time or hang. $select=values
    // also trims the response to just the cell values, not formulas/formatting.
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 25000);
    try {
      const resp = await fetch(
        `https://graph.microsoft.com/v1.0/me/drive/items/${workbookId}/workbook/worksheets('${encodeURIComponent(sheetName)}')/range(address='${rangeAddress}')?$select=values`,
        { headers, signal: controller.signal }
      );
      if (!resp.ok) {
        const errText = await resp.text();
        throw new Error(`${sheetName} sheet request failed (HTTP ${resp.status}): ${errText.slice(0, 200)}`);
      }
      const data = await resp.json();
      const values = data.values || [];
      // Trim fully-empty trailing rows so grouping/search doesn't waste time on blanks
      let lastNonEmpty = -1;
      for (let i = 0; i < values.length; i++) {
        if (values[i].some((c) => c !== null && c !== "" && c !== undefined)) lastNonEmpty = i;
      }
      return values.slice(0, lastNonEmpty + 1);
    } catch (e) {
      if (e.name === "AbortError") {
        throw new Error(`${sheetName} sheet took too long to load (over 25s) — try again, or check your connection.`);
      }
      throw e;
    } finally {
      clearTimeout(timeout);
    }
  }

  function findColumn(headerRow, candidates) {
    const lower = headerRow.map((h) => (h || "").toString().trim().toLowerCase());
    for (const c of candidates) {
      const idx = lower.indexOf(c);
      if (idx !== -1) return idx;
    }
    for (const c of candidates) {
      const idx = lower.findIndex((h) => h.includes(c));
      if (idx !== -1) return idx;
    }
    return -1;
  }

  // ---------- Search ----------
  function norm(s) { return (s || "").toString().trim().toLowerCase(); }

  // Word-overlap matching rather than whole-string substring matching — a typed
  // one- or two-word search still needs every word to appear, but a long, noisy
  // block of text (e.g. an OCR read of a full title page, with subtitle, author
  // and publisher all glued together) only needs a handful of distinctive words
  // to overlap with a stock item's title/author.
  const STOPWORDS = new Set(["the", "and", "of", "a", "an", "in", "on", "for", "from", "with", "by", "to", "or", "at"]);
  function tokenize(s) {
    return norm(s).replace(/[^a-z0-9\s]/g, " ").split(/\s+/).filter((w) => w.length >= 3 && !STOPWORDS.has(w));
  }
  function countMatches(tokens, haystack) {
    let count = 0;
    for (const t of tokens) if (haystack.indexOf(t) !== -1) count++;
    return count;
  }
  function requiredMatchesFor(tokens) {
    // A short, deliberately-typed search (up to 5 words) must match nearly every
    // word — otherwise a common short fragment like "man" floods results with
    // anything containing it — but allow exactly ONE word to be off, since an
    // OCR-read title (photo search) can have a single misread character even
    // when the rest reads perfectly, and requiring a 100% match made the whole
    // search fail on an otherwise-correct read. Long, noisy text (a full OCR
    // transcript) gets the looser ~25%-overlap rule instead.
    if (tokens.length <= 5) return Math.max(1, tokens.length - 1);
    return Math.max(4, Math.ceil(tokens.length * 0.25));
  }

  searchBtn.addEventListener("click", runSearch);
  searchBox.addEventListener("keydown", (e) => { if (e.key === "Enter") runSearch(); });

  // ---------- Search by photo (on-device OCR — no server, no API key) ----------
  photoBtn.addEventListener("click", () => photoInput.click());
  photoInput.addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0];
    photoInput.value = ""; // allow re-selecting the same file next time
    if (file) runOcrAndFill(file);
  });

  function ensureTesseractLoaded() {
    return new Promise((resolve, reject) => {
      if (window.Tesseract) { resolve(); return; }
      window.__tesseractCallbacks = window.__tesseractCallbacks || [];
      window.__tesseractCallbacks.push({ resolve, reject });
      if (window.__tesseractLoading) return;
      window.__tesseractLoading = true;
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
      s.onload = () => {
        const cbs = window.__tesseractCallbacks || [];
        window.__tesseractCallbacks = [];
        cbs.forEach((c) => c.resolve());
      };
      s.onerror = () => {
        const cbs = window.__tesseractCallbacks || [];
        window.__tesseractCallbacks = [];
        cbs.forEach((c) => c.reject(new Error("Couldn't load the photo-reading library — check your connection.")));
      };
      document.head.appendChild(s);
    });
  }

  // Title pages usually read as "Title. Subtitle: by Author. Publisher, Year."
  // — cut at the first sentence-ish break so the search box starts with a short,
  // title-like phrase instead of the whole transcript (which is too specific for
  // both the inventory match and the bookseller-site search to work well with).
  function cleanOcrText(raw) {
    const t = raw.replace(/\s+/g, " ").trim();
    const cutMatch = t.match(/^(.{8,120}?)[.:]\s/);
    return (cutMatch ? cutMatch[1] : t.slice(0, 120)).trim();
  }

  // Phone photos of old/yellowed pages often have low, uneven contrast, which
  // hurts OCR badly. Convert to greyscale and stretch contrast to full black/white
  // range before reading — cheap, and usually helps a lot with faded print.
  function preprocessForOcr(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        try {
          const maxDim = 2000;
          let w = img.naturalWidth, h = img.naturalHeight;
          if (Math.max(w, h) > maxDim) {
            const scale = maxDim / Math.max(w, h);
            w = Math.round(w * scale);
            h = Math.round(h * scale);
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          const imageData = ctx.getImageData(0, 0, w, h);
          const d = imageData.data;
          const n = w * h;
          const gray = new Uint8ClampedArray(n);
          const hist = new Uint32Array(256);
          for (let i = 0, p = 0; p < n; i += 4, p++) {
            const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
            gray[p] = g;
            hist[gray[p]]++;
          }
          // Stretch contrast between the 2nd and 98th percentile of brightness
          // rather than the true min/max — a true min/max stretch gets thrown off
          // by a small glare spot or shadow (a handful of outlier pixels), which
          // can make ordinary text contrast *worse* instead of better.
          let cum = 0, lowVal = 0, highVal = 255;
          const lowCut = n * 0.02, highCut = n * 0.02;
          for (let v = 0; v < 256; v++) { cum += hist[v]; if (cum >= lowCut) { lowVal = v; break; } }
          cum = 0;
          for (let v = 255; v >= 0; v--) { cum += hist[v]; if (cum >= highCut) { highVal = v; break; } }
          const range = Math.max(1, highVal - lowVal);
          for (let i = 0, p = 0; p < n; i += 4, p++) {
            const v = Math.max(0, Math.min(255, ((gray[p] - lowVal) / range) * 255));
            d[i] = d[i + 1] = d[i + 2] = v;
          }
          ctx.putImageData(imageData, 0, 0);
          URL.revokeObjectURL(url);
          canvas.toBlob((blob) => resolve(blob || file), "image/png");
        } catch (e) {
          URL.revokeObjectURL(url);
          resolve(file); // fall back to the original photo if processing fails
        }
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        resolve(file); // fall back to the original photo
      };
      img.src = url;
    });
  }

  async function runOcrAndFill(file) {
    photoBtn.disabled = true;
    photoStatus.textContent = "Reading photo... (first time may take a few seconds to set up)";
    photoStatus.className = "muted";
    try {
      await ensureTesseractLoaded();
      const processed = await preprocessForOcr(file);
      const result = await Tesseract.recognize(processed, "eng");
      let text = (result && result.data && result.data.text) || "";
      text = text.replace(/\s+/g, " ").trim();
      if (!text) {
        photoStatus.textContent = "Couldn't read any text from that photo — try a clearer, well-lit shot of the title page.";
        photoStatus.className = "err";
        return;
      }
      const cleaned = cleanOcrText(text);
      searchBox.value = cleaned;
      searchBox.focus();
      const extra = text.length > cleaned.length ? ` Full text read: "${text.slice(0, 300)}"` : "";
      photoStatus.textContent = "Read from photo — trimmed to a title-like phrase; edit if needed, then tap Search." + extra;
      photoStatus.className = "ok";
    } catch (e) {
      photoStatus.textContent = "Photo reading failed: " + (e.message || e);
      photoStatus.className = "err";
    } finally {
      photoBtn.disabled = false;
    }
  }

  function runSearch() {
    const q = searchBox.value.trim();
    if (!q) return; // empty box — nothing to search, leave the screen as-is
    const tokens = tokenize(q);
    // Even if the query is too short/generic to tokenize (e.g. under 3 letters),
    // still refresh the screen — silently doing nothing here looked like the
    // app was frozen when really it just had no new results to show.
    if (!tokens.length) {
      renderResults(q, [], []);
      return;
    }
    const required = requiredMatchesFor(tokens);

    const invMatches = inventoryRows.filter((r) => {
      const t = norm(r[invCols.title]);
      const a = invCols.author > -1 ? norm(r[invCols.author]) : "";
      return countMatches(tokens, t + " " + a) >= required;
    });
    const salesMatches = salesRows.filter((r) => countMatches(tokens, norm(r[salesCols.title])) >= required);

    renderResults(q, invMatches, salesMatches);
  }

  function groupInventory(rows) {
    const groups = new Map();
    for (const r of rows) {
      const title = (r[invCols.title] || "(untitled)").toString();
      const key = norm(title);
      if (!groups.has(key)) {
        groups.set(key, {
          title,
          author: invCols.author > -1 ? r[invCols.author] : "",
          count: 0,
          costs: [],
          listedPrices: [],
          statuses: {},
        });
      }
      const g = groups.get(key);
      g.count++;
      const cost = invCols.cost > -1 ? parseFloat(r[invCols.cost]) : NaN;
      if (!isNaN(cost)) g.costs.push(cost);
      const status = invCols.status > -1 ? (r[invCols.status] || "Unknown").toString() : "Unknown";
      g.statuses[status] = (g.statuses[status] || 0) + 1;
      // Only count the asking price for copies still actually available to buy —
      // a Sold/Withdrawn copy's old Regular Price isn't "currently selling for".
      const stillAvailable = ["in stock", "reserved", "on consignment"].includes(status.toLowerCase());
      if (stillAvailable && invCols.regularPrice > -1) {
        const rp = parseFloat(r[invCols.regularPrice]);
        if (!isNaN(rp)) g.listedPrices.push(rp);
      }
    }
    return Array.from(groups.values()).sort((a, b) => b.count - a.count);
  }

  function groupSales(rows) {
    const groups = new Map();
    for (const r of rows) {
      const title = (r[salesCols.title] || "(untitled)").toString();
      const key = norm(title);
      if (!groups.has(key)) groups.set(key, { title, count: 0, prices: [] });
      const g = groups.get(key);
      g.count++;
      const price = salesCols.price > -1 ? parseFloat(r[salesCols.price]) : NaN;
      if (!isNaN(price)) g.prices.push(price);
    }
    return Array.from(groups.values()).sort((a, b) => b.count - a.count);
  }

  function avg(arr) {
    if (!arr.length) return null;
    return arr.reduce((s, n) => s + n, 0) / arr.length;
  }
  function money(n) { return n === null ? "—" : "$" + n.toFixed(2); }

  function renderResults(query, invMatches, salesMatches) {
    const invGroupsFull = groupInventory(invMatches);
    const salesGroupsFull = groupSales(salesMatches);
    const invGroups = invGroupsFull.slice(0, 25);
    const salesGroups = salesGroupsFull.slice(0, 25);

    let html = "";

    html += `<h2>In your inventory (${invMatches.length} ${invMatches.length === 1 ? "copy" : "copies"} across ${invGroupsFull.length} title${invGroupsFull.length === 1 ? "" : "s"})</h2>`;
    if (invGroups.length === 0) {
      html += `<p class="muted">No matching stock on record.</p>`;
    } else {
      for (const g of invGroups) {
        const statusPills = Object.entries(g.statuses)
          .map(([s, n]) => `<span class="pill">${s}: ${n}</span>`)
          .join("");
        const listedText = g.listedPrices.length
          ? `selling at ${money(avg(g.listedPrices))}${g.listedPrices.length > 1 && Math.min(...g.listedPrices) !== Math.max(...g.listedPrices) ? ` (${money(Math.min(...g.listedPrices))}–${money(Math.max(...g.listedPrices))})` : ""}`
          : "not currently listed for sale";
        html += `<div class="card">
          <div class="title">${escapeHtml(g.title)}</div>
          <div class="meta">${g.author ? escapeHtml(g.author.toString()) + " · " : ""}${g.count} cop${g.count === 1 ? "y" : "ies"} · avg cost ${money(avg(g.costs))} · ${listedText}</div>
          <div class="meta">${statusPills}</div>
        </div>`;
      }
      if (invGroupsFull.length > 25) html += `<p class="muted">+${invGroupsFull.length - 25} more titles not shown</p>`;
    }

    html += `<h2>Past sales (${salesMatches.length} sale${salesMatches.length === 1 ? "" : "s"})</h2>`;
    if (salesGroups.length === 0) {
      html += `<p class="muted">No past sales on record.</p>`;
    } else {
      for (const g of salesGroups) {
        html += `<div class="card">
          <div class="title">${escapeHtml(g.title)}</div>
          <div class="meta">${g.count} sold · avg price ${money(avg(g.prices))}${g.prices.length ? " · range " + money(Math.min(...g.prices)) + "–" + money(Math.max(...g.prices)) : ""}</div>
        </div>`;
      }
      if (salesGroupsFull.length > 25) html += `<p class="muted">+${salesGroupsFull.length - 25} more titles not shown</p>`;
    }

    html += `<h2>Rarity &amp; current pricing</h2>
      <div id="rarityArea">
        <button class="secondary" id="rarityBtn">Check "${escapeHtml(query)}" on bookseller sites</button>
      </div>`;

    resultsEl.innerHTML = html;

    document.getElementById("rarityBtn").addEventListener("click", () => checkRarity(query));
  }

  function ensureGcseLoaded(callback) {
    if (gcseLibraryReady) {
      callback();
      return;
    }
    gcseLoadCallbacks.push(callback);
    if (window.__gcseScriptInjected) return;
    window.__gcseScriptInjected = true;
    // Configuring searchCallbacks.web.ready gives us the raw result objects
    // (title/snippet/link) for each result instead of just an opaque rendered
    // box — lets us build our own cards AND pull a price out of the listing text.
    window.__gcse = {
      parsetags: "explicit",
      callback: function () {
        gcseLibraryReady = true;
        const cbs = gcseLoadCallbacks;
        gcseLoadCallbacks = [];
        cbs.forEach((cb) => cb());
      },
      searchCallbacks: {
        web: { ready: handleGcseResults },
      },
    };
    const s = document.createElement("script");
    s.src = "https://cse.google.com/cse.js?cx=" + GOOGLE_CSE_CX;
    s.async = true;
    s.onerror = function () {
      const cbs = gcseLoadCallbacks;
      gcseLoadCallbacks = [];
      cbs.forEach((cb) => cb("load-failed"));
    };
    document.head.appendChild(s);
  }

  // Pulls the first plausible currency amount out of a listing snippet, e.g.
  // "US$ 45.00 Convert Currency..." -> 45.00. Best-effort — snippets don't
  // always include a price, and currencies aren't normalized.
  function extractPrice(text) {
    if (!text) return null;
    const m = text.match(/(?:US\$|AU\$|A\$|NZ\$|£|€|\$|GBP|USD|AUD)\s?([\d]{1,3}(?:,\d{3})*(?:\.\d{1,2})?)/i);
    if (!m) return null;
    const num = parseFloat(m[1].replace(/,/g, ""));
    return isNaN(num) ? null : num;
  }

  function handleGcseResults(name, q, promos, results, resultsDiv) {
    if (name !== currentRarityGname) return false; // not our active query — let default handling happen
    const spinner = document.getElementById("gcseSpinner");
    if (spinner) spinner.remove();

    if (!results || !results.length) {
      resultsDiv.innerHTML = `<p class="muted">No matches on the curated sites.</p>`;
      return true;
    }

    const prices = [];
    let cardsHtml = "";
    for (const r of results.slice(0, 10)) {
      const title = r.titleNoFormatting || r.title || "(untitled)";
      const url = r.unescapedUrl || r.url || r.contextUrl || r.visibleUrl || "#";
      const snippet = r.contentNoFormatting || r.content || "";
      const price = extractPrice(snippet);
      if (price !== null) prices.push(price);
      cardsHtml += `<div class="card">
        <div class="title"><a href="${url}" target="_blank" rel="noopener">${escapeHtml(title)}</a></div>
        <div class="meta">${escapeHtml(snippet)}</div>
        ${price !== null ? `<div class="meta">Listed at ~${money(price)}</div>` : ""}
      </div>`;
    }

    let summaryHtml;
    if (prices.length) {
      const lo = Math.min(...prices), hi = Math.max(...prices);
      summaryHtml = `<p class="muted">Estimated price range from ${prices.length} of ${results.length} listing${results.length === 1 ? "" : "s"}: ${money(lo)}${hi !== lo ? " – " + money(hi) : ""} (currencies not normalized — check each listing)</p>`;
    } else {
      summaryHtml = `<p class="muted">${results.length} result${results.length === 1 ? "" : "s"} — no price detected in the listing text</p>`;
    }

    resultsDiv.innerHTML = summaryHtml + cardsHtml;
    return true; // suppress Google's default rendering — we've built our own
  }

  function checkRarity(query) {
    gcseRarityCounter++;
    const divId = "gcseResultsDiv" + gcseRarityCounter;
    const gname = "rarityResults" + gcseRarityCounter;
    currentRarityGname = gname;
    const area = document.getElementById("rarityArea");
    area.innerHTML = `<p class="spinner-note" id="gcseSpinner">Loading bookseller search...</p><div id="${divId}"></div>` + fallbackLink(query);

    ensureGcseLoaded(function (err) {
      if (err) {
        area.innerHTML = `<p class="err">Bookseller search widget failed to load.</p>` + fallbackLink(query);
        return;
      }
      try {
        google.search.cse.element.render({ div: divId, tag: "searchresults-only", gname: gname });
        const el = google.search.cse.element.getElement(gname);
        el.execute(query);
      } catch (e) {
        area.innerHTML = `<p class="err">Bookseller search failed: ${escapeHtml(e.message || e)}</p>` + fallbackLink(query);
      }
    });
  }

  function fallbackLink(query) {
    return `<p class="meta" style="margin-top:10px;"><a href="https://www.google.com/search?q=${encodeURIComponent(query + " book price")}" target="_blank" rel="noopener">Open an unrestricted Google search instead →</a></p>`;
  }

  function escapeHtml(s) {
    return (s || "").toString()
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
</script>
</body>
</html>
